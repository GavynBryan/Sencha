name: Apply Template CI Fix

on:
  push:
    branches:
      - agent/runtime-world-stabilization

permissions:
  contents: write

jobs:
  patch-template-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          ref: agent/runtime-world-stabilization

      - name: Replace removed facade calls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("template/src/TemplateGame.cpp")
          text = path.read_text()
          old = "registry.Entities.GetAliveEntities()"
          replacement = "registry.Components.GetAliveEntities()"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 stale facade calls, found {count}")
          path.write_text(text.replace(old, replacement))
          PY

      - name: Commit source fix and remove temporary workflow
        run: |
          rm .github/workflows/export-template-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template/src/TemplateGame.cpp .github/workflows/export-template-source.yml
          git commit -m "Fix template entity storage access"
          git push origin HEAD:agent/runtime-world-stabilization
