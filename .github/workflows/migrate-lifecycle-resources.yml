name: Migrate Lifecycle Resources

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-lifecycle-resources:
    if: github.head_ref == 'agent/runtime-world-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          ref: agent/runtime-world-stabilization

      - name: Migrate lifecycle resources
        run: |
          set +e
          python .github/scripts/migrate_lifecycle_resources.py > /tmp/migration.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tac /tmp/migration.log
            exit "$status"
          fi
          cat /tmp/migration.log

      - name: Remove temporary migration files
        run: |
          rm .github/workflows/migrate-lifecycle-resources.yml
          rm .github/scripts/migrate_lifecycle_resources.py

      - name: Commit lifecycle migration
        run: |
          git config user.name 'sencha-runtime-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move component lifecycle to registry resources'
          git push origin HEAD:agent/runtime-world-stabilization
