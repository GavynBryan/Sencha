name: Reuse runtime frame zone view

on:
  push:
    paths:
      - '.github/workflows/reuse-runtime-frame-zone-view.yml'
      - 'tools/temporary/reuse_runtime_frame_zone_view.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply frame view reuse correction
        run: python3 tools/temporary/reuse_runtime_frame_zone_view.py
      - name: Commit corrected source
        run: |
          git config user.name "sencha-runtime-world"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(world): reuse frame zone view storage"
          git push origin HEAD:${GITHUB_REF_NAME}
