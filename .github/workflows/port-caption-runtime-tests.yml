name: Port caption runtime tests

on:
  push:
    paths:
      - '.github/workflows/port-caption-runtime-tests.yml'
      - 'tools/temporary/port_caption_runtime_tests.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply caption runtime test cutover
        run: python3 tools/temporary/port_caption_runtime_tests.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(audio): model caption dormancy with World partitions"
          git push origin HEAD:${GITHUB_REF_NAME}
