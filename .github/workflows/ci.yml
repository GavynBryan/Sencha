name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC / Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      # Reads source only, so it runs before either leg spends time compiling.
      - name: Render layer portability checks
        run: ./scripts/check_render_portability.sh

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            glslc \
            libvulkan-dev \
            ninja-build

      - name: Build and install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
        with:
          version: 3.4.12
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci --parallel 2 2>&1 | tee build-ci.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-build-log
          path: build-ci.log
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci 2>&1 | tee test-ci.log

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-test-log
          path: test-ci.log
          if-no-files-found: error
          retention-days: 7

  # The renderer has only ever been compiled by GCC on Linux. MSVC is a
  # different front end with different defaults (LLP64, no GCC pragmas, no
  # implicit export of shared-library symbols), so this leg exists to find
  # those differences by compiling, not by reading code. No GPU is required:
  # the suite is non-graphical, and the engine only needs the Vulkan SDK
  # headers and the loader import library to build.
  windows:
    name: Windows / MSVC / Vulkan
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Install the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff
        with:
          version: latest
          cache: true

      - name: Install SDL3
        shell: pwsh
        run: vcpkg install sdl3:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DSENCHA_ENABLE_VULKAN=ON `
            -DSENCHA_ENABLE_COOK=ON `
            -DSENCHA_ENABLE_DEBUG_UI=OFF `
            -DSENCHA_ENABLE_HOT_RELOAD=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel 2 2>&1 | Tee-Object build-windows.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-build-log
          path: build-windows.log
          if-no-files-found: error
          retention-days: 7

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure 2>&1 | Tee-Object test-windows.log

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-log
          path: test-windows.log
          if-no-files-found: error
          retention-days: 7
