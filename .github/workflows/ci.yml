name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC / Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      # Reads source only, so it runs before either leg spends time compiling.
      - name: Render layer portability checks
        run: ./scripts/check_render_portability.sh

      # clang, libclang-dev and llvm-dev build sencha-component-codegen, which
      # parses the annotated component headers. They are needed to build the
      # engine, not to consume the SDK.
      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang \
            clang-tidy \
            glslc \
            libclang-dev \
            libvulkan-dev \
            llvm-dev \
            ninja-build

      - name: Build and install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
        with:
          version: 3.4.12
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci --parallel 2 2>&1 | tee build-ci.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-build-log
          path: build-ci.log
          # A failure before the step that writes it legitimately leaves no log,
          # and these steps run on any failure. Erroring there reports a missing
          # artifact on top of the real failure, which is the one thing a reader
          # scanning for the cause does not need. Same rule as the Windows leg.
          if-no-files-found: ignore
          retention-days: 7

      # Advisory, not a gate. This tree has no maintained clang-tidy baseline
      # yet, so the run exists to make the findings visible in the job log;
      # promoting it to a required check is a separate decision once the output
      # is stable. Needs the build, not just the configure: it parses generated
      # headers that only exist afterwards.
      - name: Render layer clang-tidy (advisory)
        continue-on-error: true
        timeout-minutes: 20
        run: ./scripts/run_render_tidy.sh build-ci

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci 2>&1 | tee test-ci.log

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-test-log
          path: test-ci.log
          if-no-files-found: ignore
          retention-days: 7

  # The renderer has only ever been compiled by GCC on Linux. MSVC is a
  # different front end with different defaults (LLP64, no GCC pragmas, no
  # implicit export of shared-library symbols), so this leg exists to find
  # those differences by compiling, not by reading code. No GPU is required:
  # the suite is non-graphical, and the engine only needs the Vulkan SDK
  # headers and the loader import library to build.
  windows:
    name: Windows / MSVC / Vulkan
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      VULKAN_SDK_VERSION: 1.4.350.0
      VULKAN_SDK: C:\VulkanSDK
      LLVM_RELEASE: clang+llvm-21.1.0-x86_64-pc-windows-msvc
      # vcpkg builds SDL3 from source, which is most of this job's setup time.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

    steps:
      - name: Check out source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-sdl3-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-x64-windows-sdl3-

      # LunarG ships the Windows SDK as a Qt Installer Framework executable.
      # Unpacking it with an archiver yields Bin/ and nothing else, so glslc
      # appears while the headers and vulkan-1.lib do not and find_package
      # (Vulkan) fails. Run the installer unattended, which is the only way to
      # get Include/ and Lib/.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          curl.exe --fail --location --silent --show-error --output $installer `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Start-Process -FilePath $installer -Wait -PassThru -NoNewWindow -ArgumentList `
            '--root', $env:VULKAN_SDK, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          # Fail here rather than inside CMake if the layout is not what the build needs.
          foreach ($path in "$env:VULKAN_SDK\Include\vulkan\vulkan.h",
                            "$env:VULKAN_SDK\Lib\vulkan-1.lib",
                            "$env:VULKAN_SDK\Bin\glslc.exe") {
            if (-not (Test-Path -LiteralPath $path)) { throw "Vulkan SDK is missing $path" }
          }
          # The engine DLL imports the loader, so every test process needs it at
          # load time even though none of them touch a GPU.
          $loader = @("$env:VULKAN_SDK\Bin\vulkan-1.dll", "$env:SystemRoot\System32\vulkan-1.dll") |
            Where-Object { Test-Path -LiteralPath $_ }
          if ($loader) { "Vulkan loader: $loader" } else { "::warning::no vulkan-1.dll found" }
          "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH

      - name: Install SDL3
        shell: pwsh
        run: vcpkg install sdl3:x64-windows

      # sencha-component-codegen is a LibTooling program, and the release
      # toolchain archive is the one Windows distribution that carries Clang's
      # libraries and CMake package. Only the parts the tool's build reads are
      # unpacked.
      - name: Install LLVM
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          curl.exe --fail --location --silent --show-error --output $archive `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/$env:LLVM_RELEASE.tar.xz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path C:\llvm | Out-Null
          tar.exe -xf $archive -C C:\llvm --strip-components=1 `
            "$env:LLVM_RELEASE/bin/clang.exe" "$env:LLVM_RELEASE/include" "$env:LLVM_RELEASE/lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $archive

      # Built as its own Release project: the engine's Debug CRT cannot link
      # LLVM's release libraries, and the engine only needs the binary.
      - name: Build the component generator
        shell: pwsh
        run: |
          cmake -S tools/component-codegen -B build-codegen -G "Visual Studio 17 2022" -A x64 `
            -DClang_DIR=C:/llvm/lib/cmake/clang 2>&1 | Tee-Object build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-codegen --config Release --parallel 4 2>&1 | Tee-Object -Append build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-codegen --config Release --prefix C:/sencha-codegen 2>&1 | Tee-Object -Append build-windows.log
          exit $LASTEXITCODE

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DSENCHA_COMPONENT_CODEGEN_EXECUTABLE=C:/sencha-codegen/bin/sencha-component-codegen.exe `
            -DSENCHA_ENABLE_VULKAN=ON `
            -DSENCHA_ENABLE_COOK=ON `
            -DSENCHA_ENABLE_DEBUG_UI=OFF `
            -DSENCHA_ENABLE_HOT_RELOAD=OFF 2>&1 | Tee-Object -Append build-windows.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 4 2>&1 | Tee-Object -Append build-windows.log
          exit $LASTEXITCODE

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-build-log
          path: build-windows.log
          # A failure before the generator's configure legitimately leaves no log.
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Debug --output-on-failure 2>&1 | Tee-Object test-windows.log
          exit $LASTEXITCODE

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-log
          path: test-windows.log
          if-no-files-found: ignore
          retention-days: 7
