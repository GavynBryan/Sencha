name: Establish ResourceStore

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  establish-resource-store:
    if: github.head_ref == 'agent/runtime-world-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          ref: agent/runtime-world-stabilization

      - name: Establish ResourceStore
        env:
          RESOURCE_STORE_HEADER: 
          RESOURCE_STORE_TESTS: 
        run: |
          python - <<'PYCODE'
          import base64
          import os
          from pathlib import Path

          old_header = Path('engine/include/world/ResourceRegistry.h')
          new_header = Path('engine/include/core/ResourceStore.h')
          new_header.parent.mkdir(parents=True, exist_ok=True)
          if not old_header.exists():
              raise SystemExit(f'missing {old_header}')
          old_header.rename(new_header)
          new_header.write_bytes(base64.b64decode(os.environ['RESOURCE_STORE_HEADER']))

          registry_path = Path('engine/include/world/registry/Registry.h')
          registry = registry_path.read_text()
          replacements = {
              '#include <world/ResourceRegistry.h>': '#include <core/ResourceStore.h>',
              'ResourceRegistry Resources;': 'ResourceStore Resources;',
          }
          for old, new in replacements.items():
              count = registry.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old}, found {count}')
              registry = registry.replace(old, new)
          registry_path.write_text(registry)

          old_test = Path('test/core/ResourceRegistryTests.cpp')
          new_test = Path('test/core/ResourceStoreTests.cpp')
          if not old_test.exists():
              raise SystemExit(f'missing {old_test}')
          old_test.rename(new_test)
          new_test.write_bytes(base64.b64decode(os.environ['RESOURCE_STORE_TESTS']))
          PYCODE

      - name: Remove temporary workflow
        run: rm .github/workflows/establish-resource-store.yml

      - name: Commit ResourceStore
        run: |
          git config user.name 'sencha-runtime-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Establish deterministic ResourceStore'
          git push origin HEAD:agent/runtime-world-stabilization
