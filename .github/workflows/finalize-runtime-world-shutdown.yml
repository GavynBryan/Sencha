name: Finalize runtime world shutdown

on:
  push:
    paths:
      - '.github/workflows/finalize-runtime-world-shutdown.yml'
      - 'tools/temporary/finalize_runtime_world_shutdown.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply shutdown ordering correction
        run: python3 tools/temporary/finalize_runtime_world_shutdown.py
      - name: Commit corrected source
        run: |
          git config user.name "sencha-runtime-world"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(world): preserve resource lifetime during shutdown"
          git push origin HEAD:${GITHUB_REF_NAME}
