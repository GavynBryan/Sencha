name: Add hidden zone import

on:
  push:
    paths:
      - '.github/workflows/add-hidden-zone-import.yml'
      - 'tools/temporary/add_hidden_zone_import.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply hidden import implementation
        run: python3 tools/temporary/add_hidden_zone_import.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(world): hide zone imports until publication"
          git push origin HEAD:${GITHUB_REF_NAME}
