name: Port caption gate test

on:
  push:
    paths:
      - '.github/workflows/port-caption-gate-test.yml'
      - 'tools/temporary/port_caption_gate_test.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply caption gate test patch
        run: python3 tools/temporary/port_caption_gate_test.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(audio): port caption gate to World partitions"
          git push origin HEAD:${GITHUB_REF_NAME}
