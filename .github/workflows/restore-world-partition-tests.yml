name: Restore World Partition Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-world-partition-tests:
    if: github.head_ref == 'agent/runtime-world-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          ref: agent/runtime-world-stabilization
          fetch-depth: 0

      - name: Restore tested runtime contract
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          base = 'fad05ea133d36b969d6a706c3a34420feaf18956'
          path = 'test/runtime/WorldPartitionRuntimeTests.cpp'
          content = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
          old = 'registry.Entities.Create()'
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy entity create call, found {count}')
          content = content.replace(old, 'registry.Components.CreateEntity()')
          Path(path).write_text(content)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/restore-world-partition-tests.yml

      - name: Commit restoration
        run: |
          git config user.name 'sencha-ci-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add test/runtime/WorldPartitionRuntimeTests.cpp .github/workflows/restore-world-partition-tests.yml
          git commit -m 'Restore world partition runtime tests'
          git push origin HEAD:agent/runtime-world-stabilization
