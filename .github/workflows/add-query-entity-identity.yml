name: Add query entity identity

on:
  push:
    paths:
      - '.github/workflows/add-query-entity-identity.yml'
      - 'tools/temporary/add_query_entity_identity.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply query entity identity patch
        run: python3 tools/temporary/add_query_entity_identity.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(ecs): expose generational ids from chunk queries"
          git push origin HEAD:${GITHUB_REF_NAME}
