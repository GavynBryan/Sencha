name: Fix threaded partition test

on:
  push:
    paths:
      - '.github/workflows/fix-threaded-partition-test.yml'
      - 'tools/temporary/fix_threaded_partition_test.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply threaded partition test patch
        run: python3 tools/temporary/fix_threaded_partition_test.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(zone): drain threaded partition work without PumpWork"
          git push origin HEAD:${GITHUB_REF_NAME}
