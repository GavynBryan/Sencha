name: Port asset preload zone harness

on:
  push:
    paths:
      - '.github/workflows/port-asset-preload-zone-harness.yml'
      - 'tools/temporary/port_asset_preload_zone_harness.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply asset preload harness cutover
        run: python3 tools/temporary/port_asset_preload_zone_harness.py
      - name: Commit clean source
        run: |
          git config user.name "sencha-unified-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(zone): port asset gating to RuntimeWorld packages"
          git push origin HEAD:${GITHUB_REF_NAME}
