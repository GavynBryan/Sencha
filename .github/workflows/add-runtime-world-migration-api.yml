name: Add runtime world migration API

on:
  push:
    paths:
      - '.github/workflows/add-runtime-world-migration-api.yml'
      - 'tools/temporary/add_runtime_world_migration_api.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply migration API patch
        run: python3 tools/temporary/add_runtime_world_migration_api.py
      - name: Commit cleaned source
        run: |
          git config user.name "sencha-runtime-world"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(world): add runtime entity zone migration"
          git push origin HEAD:${GITHUB_REF_NAME}
